name: android-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Run lint
        run: gradle lint --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build unsigned release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notamusic-release.jks"

      - name: Build signed release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/notamusic-release.jks
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify APK/AAB files
        run: |
          ls -lah app/build/outputs/apk/debug || true
          ls -lah app/build/outputs/apk/release || true
          ls -lah app/build/outputs/bundle/release || true
          test -s app/build/outputs/apk/debug/app-debug.apk
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test -s app/build/outputs/apk/release/app-release.apk
            test -s app/build/outputs/bundle/release/app-release.aab
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notamusic-android-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --title "NotaMusic $TAG" \
            --generate-notes
