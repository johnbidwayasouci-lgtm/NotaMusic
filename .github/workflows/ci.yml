name: android-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Run lint
        run: gradle lint --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify release secrets are available
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          echo "Release signing secrets are available (values are not printed)."

      - name: Decode and validate release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/notamusic-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "Release keystore decoded and alias validated."
          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_REQUIRED: 'true'
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/notamusic-release.jks
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify release APK signature and identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/notamusic-release.jks
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"

          EXPECTED_CERT_DIGEST=$(keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')
          ACTUAL_CERT_DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/SHA-256 digest:/{print $2; exit}')
          test -n "$EXPECTED_CERT_DIGEST"
          test -n "$ACTUAL_CERT_DIGEST"

          EXPECTED_NORMALIZED=$(printf '%s' "$EXPECTED_CERT_DIGEST" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_NORMALIZED=$(printf '%s' "$ACTUAL_CERT_DIGEST" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$EXPECTED_NORMALIZED" = "$ACTUAL_NORMALIZED"
          echo "Release APK signature and certificate verified."

      - name: Verify release AAB signature and identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/notamusic-release.jks
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          EXPECTED_CERT_DIGEST=$(keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')
          ACTUAL_CERT_DIGEST=$(keytool -printcert -jarfile "$AAB" | awk -F': ' '/SHA256:/{print $2; exit}')
          test -n "$EXPECTED_CERT_DIGEST"
          test -n "$ACTUAL_CERT_DIGEST"

          EXPECTED_NORMALIZED=$(printf '%s' "$EXPECTED_CERT_DIGEST" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_NORMALIZED=$(printf '%s' "$ACTUAL_CERT_DIGEST" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$EXPECTED_NORMALIZED" = "$ACTUAL_NORMALIZED"
          echo "Release AAB signature and certificate verified."

      - name: Verify release artifact identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | grep -Fx 'org.notamusic.app'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK" | grep -Fx '0.2.0'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK" | grep -Fx '2'
          echo "Release artifact identity verified."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotaMusic-${{ github.run_id }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NotaMusic-${{ github.ref_name }}-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK_NAME="NotaMusic-${GITHUB_REF_NAME}-release.apk"
          AAB_NAME="NotaMusic-${GITHUB_REF_NAME}-release.aab"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; uploading verified artifacts to it."
            gh release upload "$GITHUB_REF_NAME" \
              "$APK#$APK_NAME" \
              "$AAB#$AAB_NAME" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$APK#$APK_NAME" \
              "$AAB#$AAB_NAME" \
              --title "NotaMusic $GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,url
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | [.name, (.label // "")] | @tsv' > "$RUNNER_TEMP/release-assets.tsv"
          cat "$RUNNER_TEMP/release-assets.tsv"
          grep -Fq $'app-release.apk\tNotaMusic-'"${GITHUB_REF_NAME}"'-release.apk' "$RUNNER_TEMP/release-assets.tsv"
          grep -Fq $'app-release.aab\tNotaMusic-'"${GITHUB_REF_NAME}"'-release.aab' "$RUNNER_TEMP/release-assets.tsv"
          echo "GitHub Release and release assets verified."

      - name: Remove temporary release keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/notamusic-release.jks"
